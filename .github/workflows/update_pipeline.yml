name: Update Pipeline CSV

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Fetch pipeline sheet
        env:
          GSHEETS_CREDS: ${{ secrets.GSHEETS_CREDS }}
        run: python scripts/fetch_pipeline.py

      - name: Commit updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline.csv
          git diff --staged --quiet || git commit -m "chore: update pipeline CSV [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
